<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wortkasten">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F4F2">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<script>window.WK_STANDALONE=true;</script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Wortkasten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: one narrow column, app header with view switcher, exercise switcher as chips, a single task card. */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --surface2:#E6EBE8; --line:#D0D8D4;
  --fg:#17201D; --muted:#59665F;
  --accent:#2C4F9E; --accent-fg:#FFFFFF; --accent-soft:#E2E8F6;
  --ok:#1F7446; --ok-soft:#DFF0E6; --err:#B0281F; --err-soft:#F7E0DD;
  --hint:#8F620E; --hint-soft:#F5EAD2;
  --p-done:#1F3B73; --p-review:#1B8A84; --p-learn:#7FC6DA;
  --p-done-soft:#E1E7F4; --p-review-soft:#D8EFED; --p-learn-soft:#DDF0F6; --p-learn-ink:#1C6377; --p-known:#A9B6CC;
  --font-ui:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-word:"Literata", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111513; --surface:#1A201D; --surface2:#242B28; --line:#34403B;
    --fg:#E5ECE8; --muted:#9AA8A1;
    --accent:#8EA9F2; --accent-fg:#0E1526; --accent-soft:#232E4A;
    --ok:#6FCB95; --ok-soft:#1C3327; --err:#F08C80; --err-soft:#3E2220;
    --hint:#E2B45E; --hint-soft:#3A2F18;
    --p-done:#7D9BE8; --p-review:#3DBDB1; --p-learn:#2E7488;
    --p-done-soft:#1E2943; --p-review-soft:#173733; --p-learn-soft:#183039; --p-learn-ink:#8FD3E6; --p-known:#4E5D7A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1A201D; --surface2:#242B28; --line:#34403B;
  --fg:#E5ECE8; --muted:#9AA8A1;
  --accent:#8EA9F2; --accent-fg:#0E1526; --accent-soft:#232E4A;
  --ok:#6FCB95; --ok-soft:#1C3327; --err:#F08C80; --err-soft:#3E2220;
  --hint:#E2B45E; --hint-soft:#3A2F18;
  --p-done:#7D9BE8; --p-review:#3DBDB1; --p-learn:#2E7488;
  --p-done-soft:#1E2943; --p-review-soft:#173733; --p-learn-soft:#183039; --p-learn-ink:#8FD3E6; --p-known:#4E5D7A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font-family:inherit}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 48px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding-block:6px 12px}
.brand{font-family:var(--font-word);font-weight:600;font-size:1.4rem;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-family:var(--font-ui);font-size:.7rem;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
nav.views{display:flex;background:var(--surface2);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
nav.views button{flex:none;border:0;background:transparent;color:var(--muted);font-weight:500;font-size:.9rem;padding:7px 12px;border-radius:999px;cursor:pointer}
nav.views button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:500;font-size:.92rem;padding:8px 13px;border-radius:8px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.stat{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);padding-block:0 10px;font-variant-numeric:tabular-nums}
.stat b{color:var(--fg);font-weight:600}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill.new{background:var(--surface2);color:var(--muted)}
.pill.learning{background:var(--p-learn-soft);color:var(--p-learn-ink)}
.pill.review{background:var(--p-review-soft);color:var(--p-review)}
.pill.done{background:var(--p-done-soft);color:var(--p-done)}
.pill.known{background:var(--surface2);color:var(--muted)}
.knowbtn{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:.82rem;font-weight:500;padding:4px 10px;border-radius:999px;cursor:pointer}
.knowbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.listen{display:flex;flex-direction:column;gap:10px}
.listen .row{gap:8px}
.play svg{width:18px;height:18px;vertical-align:-3px;margin-right:6px}
.arts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.art{font-family:var(--font-word);font-size:1.3rem;padding:14px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);cursor:pointer}
.art.right{background:var(--ok-soft);border-color:var(--ok)}
.art.wrong{background:var(--err-soft);border-color:var(--err)}
.art:disabled{cursor:default;color:var(--fg)}
.art:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.selrow{display:flex;gap:10px;align-items:baseline;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer;font-size:.95rem}
.selrow input{width:20px;height:20px;accent-color:var(--accent);flex:none;align-self:center}
.selbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5}
.tbtn{background:none;border:0;color:var(--bg);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:0}
.task{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:16px;min-height:280px}
.prompt{display:flex;align-items:flex-start;gap:10px}
.prompt-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.label{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.prompt-main{font-family:var(--font-word);font-size:clamp(1.4rem,5.6vw,1.9rem);line-height:1.25;overflow-wrap:anywhere}
.prompt-main.sm{font-size:clamp(1.12rem,4.5vw,1.35rem)}
.say{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:grid;place-items:center;cursor:pointer}
.say svg{width:18px;height:18px}
.options{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-family:var(--font-word);font-size:1.1rem;padding:12px 14px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.opt .n{font-family:var(--font-ui);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--err-soft);border-color:var(--err)}
.opt:disabled{cursor:default;color:var(--fg)}
input.answer{width:100%;font-family:var(--font-word);font-size:1.25rem;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
input.answer:focus{outline:none;border-color:var(--accent)}
input.answer.bad{border-color:var(--err);background:var(--err-soft)}
input.answer.good{border-color:var(--ok);background:var(--ok-soft)}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.key{min-width:44px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--fg);font-family:var(--font-word);font-size:1.1rem;cursor:pointer}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:500;font-size:.95rem;padding:10px 16px;border-radius:10px;cursor:pointer;line-height:1.2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.sm{padding:6px 11px;font-size:.85rem;border-radius:8px}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.armed{background:var(--err);border-color:var(--err);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
:is(.btn,.chip,.opt,.tile,.mt,.key,.say,nav.views button,summary,input,select,textarea):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.feedback{font-size:.95rem;display:flex;flex-direction:column;gap:4px;min-height:1.3em}
.feedback .ok{color:var(--ok);font-weight:600}
.feedback .err{color:var(--err);font-weight:600}
.feedback .ex{color:var(--muted);font-size:.9rem}
.feedback .ex i{font-style:normal;color:var(--fg);font-family:var(--font-word)}
.hintline{font-family:var(--font-word);letter-spacing:.2em;color:var(--hint);font-size:1.1rem;min-height:1.2em}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{min-width:44px;height:46px;padding:0 12px;font-family:var(--font-word);font-size:1.15rem;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--fg);cursor:pointer}
.tile.used{visibility:hidden}
.tile.flash{animation:shake .3s;border-color:var(--err);background:var(--err-soft)}
.tile.hinted{border-color:var(--hint);background:var(--hint-soft)}
.slots{display:flex;flex-wrap:wrap;gap:4px 3px;font-family:var(--font-word);font-size:1.5rem;min-height:2.2rem}
.slot{min-width:1.05em;border-bottom:2px solid var(--line);text-align:center;padding:0 1px;min-height:1.5em}
.slot.space{border:0;min-width:.55em}
.slot.filled{border-color:var(--accent)}
.built{font-family:var(--font-word);font-size:1.3rem;line-height:1.6;min-height:2.2em;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;border-bottom:2px solid var(--line);padding-bottom:6px}
.built .ph{color:var(--muted)}
.sentence{font-family:var(--font-word);font-size:1.3rem;line-height:1.9;overflow-wrap:anywhere}
.gap{display:inline-block;min-width:3.5ch;border-bottom:2px solid var(--line);padding:0 3px;line-height:1.3}
.gap.cur{border-color:var(--accent);background:var(--accent-soft)}
.gap.done{border-color:var(--ok);color:var(--ok)}
.gap .rest{color:var(--muted);letter-spacing:.1em}
.trn{font-family:-apple-system,"Segoe UI","Noto Sans","DejaVu Sans","Lucida Sans Unicode",sans-serif;color:var(--muted);font-weight:400;font-size:.85em;letter-spacing:0;font-style:normal}
.trn.blk{display:block;font-size:.78em}
.prompt-body .trn{font-size:1.02rem}
.dlang{font-size:14px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);max-width:100%}
.base{font-size:.95rem;color:var(--hint);letter-spacing:normal;font-family:var(--font-ui)}
.msg{font-size:.93rem;min-height:1.35em;color:var(--muted)}
.msg.warn{color:var(--hint)} .msg.err{color:var(--err)}
mark.fix{background:var(--err-soft);color:var(--err);border-radius:3px;padding:0 1px;text-decoration:underline}
mark.hint{background:var(--hint-soft);color:var(--hint);border-radius:3px;padding:0 1px}
.gap.warn{border-color:var(--hint);color:var(--fg)}
.gap.shown{border-color:var(--err);color:var(--err)}
.sub-inline{color:var(--muted);font-size:.88rem}
.seg-tabs{display:flex;gap:4px;flex-wrap:wrap}
.seg-tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:.85rem;font-weight:500;padding:6px 10px;border-radius:8px;cursor:pointer}
.seg-tabs button.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.wr{display:flex;gap:12px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.wtxt{flex:1;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.wtxt .wf{font-family:var(--font-word)}
.wtxt .wt{font-size:.85rem;color:var(--muted)}
.wm{width:112px;flex:none;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.meter{width:100%;height:6px;background:var(--surface2);border-radius:999px;overflow:hidden}
.meter span{display:block;height:100%;border-radius:999px}
.brandrow{display:flex;align-items:center;gap:12px}
.addbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:1.6rem;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 2px}
.addbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,15,13,.38);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow:auto;border-radius:16px 16px 0 0;padding-top:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -6px 24px rgba(0,0,0,.18)}
@media (min-width:700px){.sheet{align-items:center}.sheet-in{border-radius:16px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet .field input,.sheet .field textarea,.sheet .field select{font-family:var(--font-ui);font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:100%}
.sheet details summary{cursor:pointer;color:var(--accent);font-size:.9rem}
.sheet details[open]{display:flex;flex-direction:column;gap:10px}
.recent{display:flex;flex-wrap:wrap;gap:6px}
.recent span{font-size:.85rem;background:var(--surface2);padding:3px 8px;border-radius:999px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:.88rem;cursor:pointer;text-decoration:underline;align-self:flex-start}
.wr[data-wid]{cursor:pointer}
.streak{border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center;border-radius:50%}
.kpis{display:flex;gap:14px 28px;flex-wrap:wrap;align-items:center}
.kpi{display:flex;gap:12px;align-items:center}
.kv{font-family:var(--font-word);font-size:2rem;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.ks{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.boxes{display:grid;gap:6px;height:180px}
.box{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%}
.bwrap{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;min-height:0}
.bb{width:100%;max-width:46px;border-radius:5px 5px 0 0}
.bv{font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums}
.bl{font-size:.68rem;color:var(--muted);text-align:center;line-height:1.15;min-height:2.3em}
.miles{display:flex;gap:8px;flex-wrap:wrap}
.mile{display:flex;flex-direction:column;gap:1px;padding:8px 12px;border:1px dashed var(--line);border-radius:10px;min-width:76px;font-size:.78rem;color:var(--muted);max-width:100%}
.mile b{font-family:var(--font-word);font-size:1.15rem;color:var(--muted)}
.mile.on{border:1px solid var(--p-done);background:var(--p-done-soft)}
.mile.on b{color:var(--p-done)}
.mile .prize{color:var(--fg);overflow-wrap:anywhere}
.ansbox{display:flex;flex-direction:column;gap:4px}
.under{display:flex;justify-content:space-between;gap:10px;min-height:1.6em;align-items:baseline}
.corr{font-family:var(--font-word);font-size:1.15rem;color:var(--err)}
.lay{font-size:.78rem;color:var(--muted)}
.wn{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mosaic{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mt{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:1rem;padding:10px 12px;border-radius:10px;cursor:pointer;min-height:52px;overflow-wrap:anywhere}
.mt.f{font-family:var(--font-word);font-size:1.05rem}
.mt.sel{border-color:var(--accent);background:var(--accent-soft)}
.mt.done{opacity:.3;pointer-events:none}
.mt.bad{animation:shake .3s;border-color:var(--err);background:var(--err-soft)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.summary{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.summary h2{font-family:var(--font-word);font-weight:600;font-size:1.4rem;margin:0}
.summary p{margin:0;color:var(--muted)}
.toast{display:flex;gap:14px;align-items:center;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.92rem;max-width:calc(100% - 32px);z-index:20;box-shadow:0 4px 16px rgba(0,0,0,.2)}
/* lists & panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
h2.h{font-family:var(--font-word);font-weight:600;font-size:1.25rem;margin:4px 0 0;text-wrap:balance}
.note{font-size:.88rem;color:var(--muted);margin:0;max-width:62ch}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dict{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.dict:first-child{border-top:0;padding-top:0}
.dict-head{display:flex;gap:10px;align-items:flex-start}
.dict-name{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.dict-meta{font-size:.82rem;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--surface2);border:1px solid var(--line);pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch input:checked+span{background:var(--accent);border-color:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px);background:var(--accent-fg)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.pbar{display:flex;height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
.pbar.big{height:14px}
.seg.done{background:var(--p-done)} .seg.known{background:var(--p-known)} .seg.review{background:var(--p-review)} .seg.learning{background:var(--p-learn)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bignum{font-family:var(--font-word);font-size:2.6rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.bignum small{font-family:var(--font-ui);font-size:1rem;font-weight:400;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:80px}
.day{background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.day.zero{background:var(--surface2)}
.dayl{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-size:.66rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.words{display:flex;flex-direction:column}
.w{display:flex;gap:10px;align-items:baseline;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--fg);text-align:left;font-size:.95rem;width:100%}
.w .wf{font-family:var(--font-word);flex:1;min-width:0;overflow-wrap:anywhere}
.w .wt{flex:1;min-width:0;color:var(--muted);overflow-wrap:anywhere}
.form{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-block:6px}
.form label,.field{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.form input,.form textarea,.field input,.field select,.field textarea,textarea.big{font-family:var(--font-ui);font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:100%}
textarea.big{min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.prev{border-collapse:collapse;font-size:.85rem;min-width:100%}
table.prev td,table.prev th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
table.prev select{font-size:14px;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
details.set{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.set>summary{padding:14px 16px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.set>summary::-webkit-details-marker{display:none}
details.set>summary::after{content:"+";color:var(--muted);font-weight:400}
details.set[open]>summary::after{content:"−"}
.setbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:2px}
.sr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;border-top:1px solid var(--line);font-size:.93rem}
.sr:first-child{border-top:0}
.sr>span{flex:1;min-width:0}
.sr input[type=number]{width:84px;font-size:16px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);text-align:right;font-variant-numeric:tabular-nums}
.sr select,.sr input[type=text]{font-size:16px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);max-width:55%}
.sr input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.sub{font-size:.78rem;color:var(--muted);display:block}
.stages{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.stages th{font-weight:500;color:var(--muted);text-align:left;padding:4px}
.stages td{padding:4px}
.stages input{width:64px;font-size:16px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);text-align:right}
.empty{color:var(--muted);text-align:left;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty b{color:var(--fg)}

.libl{display:flex;flex-direction:column}
.libi{display:flex;gap:12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.libi:first-child{border-top:0}
.help{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 8px;display:flex;flex-direction:column;gap:4px}
.help h2.h{margin:0 0 6px}
.help section{padding-block:10px;border-top:1px solid var(--line)}
.help section:first-of-type{border-top:0;padding-top:0}
.help h3{font-family:var(--font-word);font-weight:600;font-size:1.08rem;margin:0 0 6px;text-wrap:balance}
.help p,.help li{max-width:65ch;margin:0 0 8px;font-size:.95rem}
.help ol,.help ul{margin:0 0 8px;padding-left:1.3em}
.help i{font-family:var(--font-word)}
</style>

const IPA=/[ˈˌːəæɪʊʌɔɑɒɜθðʃʒŋɛɐ]/;
function splitTr(o){
  o.tr=String(o.tr||'').trim();
  if(!o.tr){let m=String(o.w).match(/\s*\[([^\]]+)\]\s*/);
    if(!m){const m2=String(o.w).match(/\s*\/([^\/]+)\/\s*/);if(m2&&IPA.test(m2[1]))m=m2;}
    if(m){o.tr=m[1].trim();o.w=String(o.w).replace(m[0],' ').replace(/\s+/g,' ').trim();}}
  if(!o.tr){const m=String(o.t).match(/^\s*\[([^\]]+)\]\s*/);if(m){o.tr=m[1].trim();o.t=String(o.t).slice(m[0].length).trim();}}
  o.tr=o.tr.replace(/^[\[\/]+|[\]\/]+$/g,'').trim();return o;
}

function mergeDeep(def,cur){
  if(Array.isArray(def)) return Array.isArray(cur)?cur:def;
  if(def&&typeof def==='object'){const o={};for(const k in def)o[k]=mergeDeep(def[k],cur?cur[k]:undefined);return o;}
  return (cur===undefined||cur===null||typeof cur!==typeof def)?def:cur;

function load(){
  let raw=null;try{raw=localStorage.getItem(KEY);}catch(e){}

  const mig=(S.settings&&S.settings.mig)||0;
  S.settings=mergeDeep(defaults(),S.settings);
  if(mig<1){S.settings.ex.cloze.showBase=false;}
  S.settings.mig=1;
  if(!LANGS[S.settings.lang])S.settings.lang=detectLang();
  L=S.settings.lang;

  S.log=S.log||{}; S.miles=S.miles||{}; S.best=S.best||0; S.ui=Object.assign({view:'learn',ex:'writing'},S.ui||{});
}

  if(NP&&S.ui.view==='learn')x=x.replace(/[.,!?;:„“”"«»‚‘’()–—]/g,'').replace(/\s+/g,' ').replace(/^ /,'');
  return x.replace(/ё/g,'е').replace(/Ё/g,'Е');

function checkTyped(val,targets){

  for(const tg of targets){const n=norm(tg).trim();if(v.trim()&&v.trim()===n)return{state:'ok',alt:tg};if(!pre&&n.startsWith(v))pre={state:'prefix',alt:tg};}
  if(pre)return pre;

  for(const tg of targets){const n=norm(tg).trim();let i=0;while(i<v.length&&i<n.length&&v[i]===n[i])i++;if(i>bl){bl=i;ba=tg;}}

function origPrefix(alt,k){for(let i=0;i<=alt.length;i++){if(norm(alt.slice(0,i)).length>=k)return alt.slice(0,i);}return alt;}
function autoMark(w,exs=w.ex){
  if(!exs)return null;
  const heads=splitParts(w.w).map(p=>stripTags(p).replace(/^(der|die|das|ein|eine|sich|to|a|an|the)\s+/i,'').trim()).filter(Boolean);
  const toks=exs.split(/(\s+)/);
  for(const h of heads){
    const lm=h.split(' ')[0].toLowerCase();if(lm.length<2)continue;
    const c=new Set([lm,...['e','en','n','s','es','er','ern','ns','ing','ed','d'].map(x=>lm+x)]);
    if(lm.endsWith('e')){c.add(lm.slice(0,-1)+'ing');}if(lm.endsWith('y')){c.add(lm.slice(0,-1)+'ies');c.add(lm.slice(0,-1)+'ied');}
    const stem=lm.endsWith('en')?lm.slice(0,-2):lm.endsWith('n')?lm.slice(0,-1):null;
    if(stem&&stem.length>=3){['e','st','t','en','et','te','test','ten','tet'].forEach(x=>c.add(stem+x));c.add('ge'+stem+'t');c.add('ge'+stem+'et');}
    for(let i=0;i<toks.length;i++){
      const m=toks[i].match(/^([^\p{L}]*)([\p{L}\-]+)([^\p{L}]*)$/u);if(!m)continue;
      if(c.has(m[2].toLowerCase())){toks[i]=m[1]+'{'+m[2]+'}'+m[3];return toks.join('');}
    }
  }

}
const exList=w=>[[w.ex,w.exT],[w.ex2,w.exT2],[w.ex3,w.exT3]].map(([e,tr],i)=>({i,ex:(e||'').trim(),exT:(tr||'').trim()})).filter(x=>x.ex);

function fixLayout(val,target){
  if(!G().layoutFix)return val;const want=scriptOf(target||'');if(!want)return val;
  const lat=LAT_KEYS[/^en/i.test(CURLANG)?'qwerty':/^de/i.test(CURLANG)?'qwertz':G().foreignLayout]||LAT_KEYS.qwertz;const beT=/[іў]/i.test(target||'');let out='';
  for(const ch of val){const lo=ch.toLowerCase(),up=ch!==lo;let m=null;
    if(want==='lat'&&/[а-яёіўєїґ]/i.test(ch)){const i=RU_KEYS.indexOf(CYR_ALIAS[lo]||lo);m=i>=0&&/\p{L}/u.test(lat[i])?lat[i]:'';}

function toReview(w){
  const st=S.settings.repeat.stages;
  if(S.settings.repeat.enabled&&st.length){w.st='review';w.stage=1;w.hits=0;w.due=dayStart(st[0].after);w.dl=dayStart(Math.max(st[0].deadline,st[0].after));return'learned';}
  w.st='done';return'done';
}
function dropBack(w){w.st='learning';w.sc=Math.round(G().threshold/2);w.stage=0;w.hits=0;w.due=0;w.dl=0;}
let lastNote=null;
function restInfo(w,now=Date.now()){const g=G();if(w.st!=='learning')return null;
  if(g.dailyCap>0&&w.dayK===dayKey(now)&&(w.dayPts||0)>=g.dailyCap)return{k:'cap'};
  if(g.minGap>0&&w.lastPts&&now-w.lastPts<g.minGap*60000)return{k:'gap',until:w.lastPts+g.minGap*60000};return null;}
const resting=(w,now)=>!!restInfo(w,now);
const hhmm=ts=>{try{return new Date(ts).toLocaleTimeString(LOCALE[L]||'en-GB',{hour:'2-digit',minute:'2-digit'});}catch(e){return new Date(ts).toTimeString().slice(0,5);}};
function restLabel(w){const r=restInfo(w);return !r?'':r.k==='cap'?t('pill_cap'):t('pill_gap',{h:hhmm(r.until)});}
function applyResult(w,type,correct,cost){
  const e=S.settings.ex[type],g=G();let ev=null;lastNote=null;
  w.last=Date.now();if(correct)w.ok++;else w.err++;
  if(w.st==='new')w.st='learning';
  if(w.st==='review'){
    if(correct){w.hits++;const st=S.settings.repeat.stages,cur=st[w.stage-1];
      if(!cur||w.hits>=cur.times){
        if(w.stage<st.length){const nx=st[w.stage];w.stage++;w.hits=0;w.due=dayStart(nx.after);w.dl=dayStart(Math.max(nx.deadline,nx.after));ev='stage';}
        else{w.st='done';ev='done';}
      }
    }else{dropBack(w);ev='dropped';}
  }else if(w.st==='learning'){
    if(correct){
      const today=dayKey();if(w.dayK!==today){w.dayK=today;w.dayPts=0;}
      let add=Math.max(0,e.plus-(cost||0));
      if(g.minGap>0&&w.lastPts&&Date.now()-w.lastPts<g.minGap*60000){add=0;lastNote='gap';}
      else if(g.dailyCap>0&&w.dayPts+add>g.dailyCap){add=Math.max(0,g.dailyCap-w.dayPts);if(!add)lastNote='cap';}
      w.sc+=add;w.dayPts+=add;if(add>0)w.lastPts=Date.now();
    }
    else w.sc=g.resetOnError?0:Math.max(0,w.sc-e.minus);
    if(w.sc>=g.threshold){w.sc=g.threshold;ev=toReview(w);}
  }
  const k=dayKey();const Lg=S.log[k]||(S.log[k]={n:0,ok:0});Lg.n++;if(correct)Lg.ok++;
  S.lastActiveDay=k;return ev;
}
function maintain(){
  const now=Date.now(),today=dayKey();
  if(S.settings.repeat.overdueBack)for(const w of S.words)if(w.st==='review'&&w.dl&&now>w.dl)dropBack(w);
  const f=S.settings.forget;
  if(f.enabled&&S.lastActiveDay&&S.lastActiveDay<today){
    const missed=daysBetween(S.lastActiveDay,today)-1,pdays=Math.max(0,missed-f.grace);
    const prev=S.decay&&S.decay.from===S.lastActiveDay?S.decay.days:0,delta=pdays-prev;
    if(delta>0){for(const w of S.words)if(w.st==='learning')w.sc=Math.max(0,w.sc-f.perDay*delta);S.decay={from:S.lastActiveDay,days:pdays};}
  }
  const keys=Object.keys(S.log).sort();if(keys.length>400)keys.slice(0,keys.length-400).forEach(k=>delete S.log[k]);
  save();
}
function pickNew(pool,k){
  if(k<=0)return[];const ids0=new Set(pool.filter(w=>w.st==='new').map(w=>w.id));
  const fresh=S.words.filter(w=>ids0.has(w.id)&&w.added&&Date.now()-w.added<14*DAY).sort((a,b)=>a.added-b.added).map(w=>w.id);
  const fs=new Set(fresh);const rest=pickNew0(pool.filter(w=>!fs.has(w.id)),k);
  return [...fresh,...rest].slice(0,k);
}
function pickNew0(pool,k){
  if(k<=0)return[];const g=G();const ids=new Set(pool.filter(w=>w.st==='new').map(w=>w.id));
  if(g.newMode==='sequential'){
    for(const d of S.dicts.filter(d=>d.active)){
      let ws=S.words.filter(w=>ids.has(w.id)&&w.dicts.includes(d.id));if(!ws.length)continue;
      if(!g.learnInOrder)ws=shuffle(ws);return ws.slice(0,k).map(w=>w.id);
    }return[];
  }
  let ws=S.words.filter(w=>ids.has(w.id));if(!g.learnInOrder)ws=shuffle(ws);return ws.slice(0,k).map(w=>w.id);
}
function nounOf(w){const x=String(w.w).trim();if(/\bPl\.?(\b|$)|\(pl\)/i.test(x))return null;const m=x.match(/^(der|die|das)\s+([^,;(\/]+)/i);return m&&m[2].trim()?{a:m[1].toLowerCase(),n:m[2].trim()}:null;}
const artConf=w=>(w.aRun||0)>=S.settings.ex.article.confident;
function buildArticleRound(){
  const nouns=activeWords().filter(nounOf),n=S.settings.ex.article.perRound;
  const weak=shuffle(nouns.filter(w=>!artConf(w))).sort((a,b)=>(b.aErr||0)-(a.aErr||0)||((a.st==='new')-(b.st==='new')));
  const conf=shuffle(nouns.filter(artConf));
  return shuffle([...weak.slice(0,n),...conf.slice(0,Math.max(0,n-weak.length))]).map(w=>w.id);

function poolFor(type){
  let p=activeWords();
  if(type==='article')return p.filter(nounOf);
  if(type==='dictation'&&S.settings.ex.dictation.mode==='phrase')p=p.filter(w=>exList(w).some(x=>phraseOk(x.ex)));
  if(type==='cloze')p=p.filter(clozeOk);
  else if(type==='phrase')p=p.filter(w=>exList(w).some(x=>phraseOk(x.ex)));

function buildRound(type){
  const g=G(),now=Date.now(),pool=poolFor(type),n=g.perRound;
  const due=pool.filter(w=>w.st==='review'&&w.due<=now).sort((a,b)=>a.due-b.due).map(w=>w.id);
  const learning=pool.filter(w=>w.st==='learning').sort((a,b)=>(resting(a,now)-resting(b,now))||a.sc-b.sc||b.err-a.err).map(w=>w.id);
  const learningAll=activeWords().filter(w=>w.st==='learning').length;
  const free=Math.max(0,g.inLearning-learningAll);
  const newIds=pickNew(pool,free),out=[];
  const take=(arr,k)=>{for(const id of arr){if(out.length>=n||k<=0)break;if(!out.includes(id)){out.push(id);k--;}}};
  const retry=pool.filter(w=>w.retry&&w.st!=='done').map(w=>w.id);take(retry,n);
  take(due,Math.round(n*g.reviewShare/100));
  take(newIds,Math.min(free,Math.ceil(n*.34)));
  take(learning,n);take(newIds,n);take(due,n);
  const rs=new Set(retry);return [...shuffle(out.filter(id=>rs.has(id))),...shuffle(out.filter(id=>!rs.has(id)))];
}
function pickDir(){const d=G().direction;return d==='both'?(Math.random()<.5?'toForeign':'toNative'):d;}
function distractors(w,field,k){
  const val=w[field],nv=norm(val);
  const sc=S.words.filter(x=>x.id!==w.id&&x[field]&&norm(x[field])!==nv)
    .map(x=>({x,s:Math.abs(x[field].length-val.length)/Math.max(4,val.length)+(x.dicts.some(d=>w.dicts.includes(d))?0:.5)+Math.random()*.6}))
    .sort((a,b)=>a.s-b.s);
  const out=[],seen=new Set([nv]);
  for(const{x}of sc){const n=norm(x[field]);if(seen.has(n))continue;seen.add(n);out.push(x[field]);if(out.length>=k)break;}
  return out;
}

  else if(R.type==='cloze'){const x=pickEx(w,e=>!!clozeOf(w,e));c.ex=x.ex;c.exT=x.exT;c.parts=parseCloze(clozeOf(w,x.ex));c.gaps=c.parts.filter(p=>p.gap!=null).map(p=>p.gap);c.gi=0;c.typed='';if(ex.showBase)c.cost+=ex.costBase;}

  st.innerHTML=`<span>${t('st_left')} <b>${left}</b></span><span>${t('st_ok')} <b>${R.ok}</b></span><span>${t('st_bad')} <b>${R.bad}</b></span>${chip}${kb}`;
}
const trShow=w=>w&&w.tr&&G().showTr!=='never';
const trHTML=w=>trShow(w)?` <span class="trn">[${esc(w.tr)}]</span>`:'';
const wordLine=w=>`<span><b lang="${wl(w).slice(0,2)}">${esc(w.w)}</b>${trHTML(w)} — ${esc(w.t)}</span>`;
function prompt(label,text,{sm=false,foreign=false,lang='',tr=''}={}){
  return `<div class="prompt"><div class="prompt-body"><span class="label">${label}</span><div class="prompt-main${sm?' sm':''}"${lang?` lang="${lang}"`:''}>${esc(text)}</div>${tr?`<span class="trn">[${esc(tr)}]</span>`:''}</div>${foreign?`<button class="say" data-act="say" aria-label="${t('say')}">${SPK}</button>`:''}</div>`;
}
const exampleLine=w=>{const xs=exList(w);if(!xs.length)return '';const x=xs[Math.floor(Math.random()*xs.length)];return `<span class="ex"><i lang="de">${esc(stripBraces(x.ex))}</i>${x.exT?' — '+esc(x.exT):''}</span>`;};
function evMsg(ev){const d=R&&R.cur&&R.cur.w?fmtDate(R.cur.w.due):'';const m=ev==='learned'?t('ev_learned',{d}):ev==='stage'?t('ev_stage',{d}):ev==='done'?t('ev_done'):ev==='dropped'?t('ev_dropped'):'';return m;}
function finish(correct){

    if(R.type==='choice'){if(!R.requeued.has(c.w.id)){R.requeued.add(c.w.id);R.queue.push(c.w.id);}}

const MILES=[50,100,250,500,1000,2000];

  const done=S.words.filter(x=>x.st==='done').length;
  for(const m of MILES)if(done>=m&&!S.miles[m]){S.miles[m]=dayKey();const pr=(S.settings.prizes[m]||'').trim();toast(t('t_mile',{m})+(pr?t('t_prize',{p:pr}):''),7000);}
  drawStreak();
}
function streakInfo(){
  let cur=0;for(let i=0;i<400;i++){const n=(S.log[dayKey(dayStart(-i))]||{}).n||0;if(n)cur++;else if(i>0)break;}
  let best=0,run=0,prev=null;for(const k of Object.keys(S.log).sort()){if(!(S.log[k].n>0))continue;run=prev&&daysBetween(prev,k)===1?run+1:1;prev=k;best=Math.max(best,run);}
  S.best=Math.max(S.best||0,best,cur);

}
function ring(size,frac,label,sw=4){const r=size/2-sw/2-1,C=2*Math.PI*r,h=size/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${h}" cy="${h}" r="${r}" fill="none" style="stroke:var(--surface2)" stroke-width="${sw}"/><circle cx="${h}" cy="${h}" r="${r}" fill="none" style="stroke:var(--p-review)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-Math.min(1,frac))).toFixed(1)}" transform="rotate(-90 ${h} ${h})"/><text x="${h}" y="${h}" text-anchor="middle" dominant-baseline="central" style="fill:var(--fg);font:600 ${Math.round(size*.36)}px var(--font-ui)">${label}</text></svg>`;}
function drawStreak(){const el=$('#streak');if(!el||!S)return;const s=streakInfo();el.innerHTML=ring(38,s.today/s.goal,s.cur);const a=t('streak_aria',{n:s.cur,d:pw(s.cur,'days'),a:s.today,g:s.goal});el.setAttribute('aria-label',a);el.title=a;}
function scheduleNext(correct){const fb=$('#fb');if(fb&&R&&R.cur&&R.cur.w&&!fb.querySelector('[data-act="editw"]'))fb.insertAdjacentHTML('beforeend',`<button class="linkbtn" data-act="editw" data-keep>${t('edit')}</button>`);if(correct&&G().autoNext)R.timer=setTimeout(nextTask,G().nextDelay);}
function drawTask(){

function bindTask(){

function onTaskClick(e){
  const b=e.target.closest('[data-act]');if(!b||!R)return;const act=b.dataset.act,c=R.cur;
  if(act==='again'){startRound(R.type);return;}
  if(act==='dicts'){setView('dicts');return;}
  if(act==='next'){nextTask();return;}
  if(act==='editw'){if(c&&c.w){clearTimeout(R.timer);openEdit(c.w,()=>{if(R&&R.cur===c&&c.done&&!document.querySelector('#task [data-act="next"]'))nextTask();});}return;}
  if(act==='say'){if(c&&c.w)speak(R.type==='phrase'||R.type==='cloze'?c.ex:c.w.w,true);return;}
  if(act==='play'||act==='slow'){if(c&&c.say)speak(c.say,true,{force:true,slow:act==='slow'});const i=$('#answer');if(i)try{i.focus({preventScroll:true});}catch(e){}return;}
  if(act==='art')return pickArticle(+b.dataset.i,b);

  if(act==='mt')return mosaicTap(b);

}

/* ---- choice ---- */
function drawChoice(){

function pickOption(i,btn){

/* ---- mosaic ---- */
function drawMosaic(){
  const c=R.cur,tk=task();tk.dataset.kind='mosaic';const W=id=>c.chunk.find(w=>w.id===id);
  const btn=(id,side)=>`<button class="mt${side==='l'?' f':''}${c.matched.has(id)?' done':''}${c.sel&&c.sel.id===id&&c.sel.side===side?' sel':''}" data-act="mt" data-side="${side}" data-id="${id}"${side==='l'?' lang="de"':''}>${side==='l'?esc(W(id).w)+(G().showTr==='always'&&W(id).tr?`<span class="trn blk">[${esc(W(id).tr)}]</span>`:''):esc(W(id).t)}</button>`;
  tk.innerHTML=`<span class="label">${t('mosaic_lbl')}</span><div class="mosaic"><div class="mcol">${c.left.map(id=>btn(id,'l')).join('')}</div><div class="mcol">${c.right.map(id=>btn(id,'r')).join('')}</div></div><div class="feedback" id="fb"></div>`;

function mosaicTap(b){
  const c=R.cur,id=b.dataset.id,side=b.dataset.side;if(c.matched.has(id))return;

function corr(text){const m=$('#corr');if(m)m.textContent=text||'';}
let layT=null;

function marked(text,g){

}
function drawSentence(){
  const c=R.cur,ex=S.settings.ex.cloze;let gi=0;const n=c.gaps.length;

    if(p.text!=null)return esc(p.text);const i=gi++;
    if(i<c.gi||c.done){

    }
    if(i===c.gi){const typed=c.typed||'';const rest=Math.max(0,[...p.gap].length-[...typed].length);return `<span class="gap cur">${esc(typed)}${ex.showLength?`<span class="rest">${'_'.repeat(rest)}</span>`:(typed?'':'&nbsp;')}</span>`;}
    return `<span class="gap">${ex.showLength?'<span class="rest">'+'_'.repeat([...p.gap].length)+'</span>':'&nbsp;'}</span>`;}).join('')}</div>`;
}
const curTargets=()=>R.type==='cloze'?[R.cur.gaps[R.cur.gi]]:R.cur.targets;
const gIdx=()=>R.type==='cloze'?R.cur.gi:0;
function reveal(lbl){const c=R.cur;const ans=R.type==='cloze'?c.gaps[c.gi]:c.targets[0];const fb=$('#fb');if(fb&&!fb.querySelector('.rv'))fb.insertAdjacentHTML('afterbegin',`<span class="rv">${lbl}: <b lang="de">${esc(ans)}</b></span>`);}

function onInput(e){
  const c=R.cur;if(!c||c.done)return;const inp=e.target,ex=S.settings.ex[R.type];
  clearTimeout(c.pend);
  const lf=fixLayout(inp.value,curTargets()[0]);if(lf!==inp.value){inp.value=lf;flashLayout();}
  const r=checkTyped(inp.value,curTargets());
  if(r.state==='wrong'){
    noteFix(r.lcp,norm(inp.value)[r.lcp]||'');
    corr(ex.letterOnError?origPrefix(r.alt,r.lcp+1):'');
    if(ex.wordOnError)reveal(t('hint_lbl'));
  }else corr('');
  inp.classList.toggle('bad',r.state==='wrong');inp.classList.toggle('good',r.state==='ok');

  if(r.state==='ok'){
    const lastGap=R.type!=='cloze'||c.gi>=c.gaps.length-1;
    if(!lastGap||G().autoEnter)c.pend=setTimeout(()=>{if(R&&R.cur===c&&!c.done)accept();},G().autoEnterDelay);

function hintInput(){
  const c=R.cur;if(!c||c.done)return;const inp=$('#answer'),ex=S.settings.ex[R.type];
  const r=checkTyped(inp.value,curTargets());
  if(r.state==='ok'){clearTimeout(c.pend);accept();return;}
  const k=r.state==='wrong'?r.lcp+1:norm(inp.value).length+1;
  const fx=origPrefix(r.alt,k);inp.value=fx;c.cost+=(ex.costLetter||3);
  c.fixes.push({g:gIdx(),i:[...fx].length-1,hint:true});
  inp.dispatchEvent(new Event('input'));
  try{inp.focus({preventScroll:true});}catch(e){}
}
function checkInput(){
  const c=R.cur;if(!c||c.done)return;const inp=$('#answer'),ex=S.settings.ex[R.type];
  clearTimeout(c.pend);
  if(!inp.value.trim())return;
  const r=checkTyped(inp.value,curTargets());
  if(r.state==='ok')return accept();
  if(r.state==='prefix'){const fx=origPrefix(r.alt,norm(inp.value).length+1);noteFix([...fx].length-1,'');corr(ex.letterOnError?fx:'');}
  else{noteFix(r.lcp,norm(inp.value)[r.lcp]||'');corr(ex.letterOnError?origPrefix(r.alt,r.lcp+1):'');}
  inp.classList.add('bad');
  if(ex.wordOnError)reveal(t('hint_lbl'));

function skipInput(){const c=R.cur;if(!c||c.done)return;clearTimeout(c.pend);c.err=true;c.skipped=true;complete();}
function accept(){
  const c=R.cur,inp=$('#answer');clearTimeout(c.pend);corr('');
  if(R.type==='cloze'){
    c.answers[c.gi]=inp.value;c.gi++;c.typed='';inp.value='';inp.classList.remove('good','bad');

  }else c.answers[0]=inp.value;

}
function complete(){
  const c=R.cur,inp=$('#answer');const ok=!c.err;

  if(R.type==='cloze'){c.typed='';inp.value='';c.done=true;drawSentence();}
  else if(c.skipped)inp.value='';
  const ev=finish(ok);
  autoSay(R.type==='cloze'?c.ex:R.type==='dictation'?c.say:c.w.w);
  const isW=R.type!=='cloze';
  let h=ok?`<span class="ok">${t('correct')}</span>`:c.skipped?`<span class="err">${t('res_skip')}</span>`:'';
  if(!ok&&!c.skipped&&isW)h+=`<span>${t('your_answer')} <b lang="${(R.type==='dictation'||c.dir==='toForeign')?'de':L}" class="mk">${marked(c.answers[0]||'',0)}</b></span>`;

}
const same=(a,b)=>G().caseSensitive?a===b:a.toLowerCase()===b.toLowerCase();
function letterTap(k,btn){
  const c=R.cur;if(c.done||c.used.has(k))return;const need=c.target[c.pos];
  if(same(c.tiles[k].ch,need)){
    c.used.add(k);c.pos++;while(c.target[c.pos]===' ')c.pos++;
    if(c.pos>=c.target.length)return letterDone();drawLetters();
  }else{
    c.err=true;btn.classList.remove('flash');void btn.offsetWidth;btn.classList.add('flash');
    if(S.settings.ex.letters.letterOnError){const j=c.tiles.findIndex((x,i)=>!c.used.has(i)&&same(x.ch,need));const hb=task().querySelector(`.tile[data-i="${j}"]`);if(hb)hb.classList.add('hinted');}
  }
}
function letterTapKey(key){const c=R.cur;if(!c||c.done)return;key=fixLayout(key,c.target.join(''))||key;const k=c.tiles.findIndex((x,i)=>!c.used.has(i)&&same(x.ch,key));
  if(k>=0&&same(key,c.target[c.pos]))letterTap(k,task().querySelector(`.tile[data-i="${k}"]`));else if(key.trim()){c.err=true;}}
function letterDone(){
  const c=R.cur;drawLetters();c.done=true;const ok=!c.err;const ev=finish(ok);autoSay(c.w.w);
  task().querySelectorAll('.slot').forEach((s,i)=>{if(c.target[i]!==' ')s.textContent=c.target[i];});
  $('#fb').innerHTML=(ok?`<span class="ok">${t('correct')}</span>`:'')+wordLine(c.w)+(evMsg(ev)?`<span>${evMsg(ev)}</span>`:'')+exampleLine(c.w);

  scheduleNext(ok);
}

function phraseTap(k,btn){

  if(ws.some(x=>/[äöüßÄÖÜ]/.test(x))||ws.filter(x=>/^(der|die|das|sich)\s/i.test(x)).length>=ws.length*.1)return'de-DE';

function csvLine(l,d){const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];
  if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
  else if(ch==='"'&&cur.trim()===''){q=true;cur='';}else if(ch===d){out.push(cur.trim());cur='';}else cur+=ch;}
  out.push(cur.trim());return out;}
function parseText(txt){
  txt=txt.replace(/^﻿/,'').replace(/\r\n?/g,'\n');const lines=txt.split('\n').filter(l=>l.trim());
  const s=lines.slice(0,30),cnt=ch=>s.filter(l=>l.includes(ch)).length,half=Math.max(1,s.length*.5);
  let d=',';if(cnt('\t')>=half)d='\t';else if(cnt(';')>=half)d=';';else if(cnt('|')>=half)d='|';else if(s.filter(l=>/\s[-–—]\s/.test(l)).length>=half)d='dash';
  return lines.map(l=>d==='dash'?((m=>m?[m[1].trim(),m[2].trim()]:[l.trim()])(l.match(/^(.*?)\s[-–—]\s(.*)$/))):(d===','||d===';')?csvLine(l,d):l.split(d).map(x=>x.trim()));
}
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error('xlsx'));document.head.appendChild(s);});}
async function readFile(f){
  if(/\.(xlsx|xls|ods)$/i.test(f.name)){const X=await loadXLSX();const wb=X.read(await f.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
    return X.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}).map(r=>r.map(x=>String(x).trim())).filter(r=>r.some(Boolean));}
  return parseText(await f.text());
}

  const body=rows.slice(head?1:0,40);

  const roles=['w','t','ex','exT','ex2','exT2','ex3','exT3'];let k=0;
  const map=Array.from({length:ncol},(_,i)=>i>0&&isTrCol(i)?'tr':(roles[k++]||'-'));
  DV.imp={step:2,rows,name:name||DV.imp.name||t('i_newname'),map,head,lang:(DV.imp&&DV.imp.lang)||''};

}

  bindWordsPanel();
}
let PV={tab:'learning',sort:'asc',all:false};
function wordsPanel(ws){
  const th=G().threshold,nst=S.settings.repeat.stages.length;
  const tabs=[['learning',t('wp_learning')],['review',t('wp_review')],['done',t('wp_done')],['known',t('wp_known')]];
  const key=w=>PV.tab==='learning'?w.sc:PV.tab==='review'?w.stage*1000+w.hits:PV.tab==='known'?0:w.err;
  const alpha=(a,b)=>a.w.localeCompare(b.w,'de',{sensitivity:'base'});
  const sorts={desc:[t('wp_desc'),(a,b)=>key(b)-key(a)||alpha(a,b)],asc:[t('wp_asc'),(a,b)=>key(a)-key(b)||alpha(a,b)],alpha:[t('wp_alpha'),alpha]};
  if(!sorts[PV.sort])PV.sort='asc';
  const list=ws.filter(w=>w.st===PV.tab).sort(sorts[PV.sort][1]);
  const shown=PV.all?list:list.slice(0,30);
  const row=w=>{let pct,col,lbl;
    if(w.st==='learning'){pct=w.sc/th*100;col='var(--p-learn)';lbl=`${w.sc}/${th}`;}
    else if(w.st==='review'){pct=(w.stage-1+w.hits/Math.max(1,(S.settings.repeat.stages[w.stage-1]||{times:1}).times))/nst*100;col='var(--p-review)';lbl=t('wp_rev',{a:w.stage,b:nst,d:fmtDate(w.due)});}
    else if(w.st==='known'){pct=100;col='var(--p-known)';lbl=t('s_known');}
    else{pct=100;col='var(--p-done)';lbl=t('wp_learned');}
    return `<div class="wr" data-wid="${w.id}"><div class="wtxt"><span class="wf" lang="${wl(w).slice(0,2)}">${esc(w.w)}${w.tr?` <span class="trn">[${esc(w.tr)}]</span>`:''}</span><span class="wt">${esc(w.t)}</span></div>
      <div class="wm"><div class="meter"><span style="width:${Math.max(3,Math.min(100,pct))}%;background:${col}"></span></div><span class="wn">${lbl}${w.err?t('wp_err',{n:w.err}):''}</span></div></div>`;};
  return `<span class="label">${t('wp_title')}</span>
  <div class="row" style="justify-content:space-between">
    <div class="seg-tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${PV.tab===k}" class="${PV.tab===k?'on':''}" data-pvtab="${k}">${l} ${ws.filter(w=>w.st===k).length}</button>`).join('')}</div>
    <select id="pvsort" aria-label="${t('wp_sort')}" style="font-size:16px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)">${Object.entries(sorts).map(([k,[l]])=>`<option value="${k}" ${PV.sort===k?'selected':''}>${l}</option>`).join('')}</select>
  </div>
  <div>${shown.map(row).join('')||`<p class="note" style="padding-top:8px">${t('wp_empty')}</p>`}</div>
  ${list.length>shown.length?`<div class="row"><button class="btn sm" data-pvall="1">${t('wp_all',{n:list.length})}</button></div>`:''}`;
}
function bindWordsPanel(){
  const wp=$('#wp');if(!wp)return;
  wp.addEventListener('click',e=>{const rw=e.target.closest('[data-wid]');if(rw){const ww=S.words.find(x=>x.id===rw.dataset.wid);if(ww)openEdit(ww,()=>{wp.innerHTML=wordsPanel(activeWords());});return;}const x=e.target.closest('[data-pvtab]');if(x){PV.tab=x.dataset.pvtab;PV.all=false;}else if(e.target.closest('[data-pvall]'))PV.all=true;else return;wp.innerHTML=wordsPanel(activeWords());});
  wp.addEventListener('change',e=>{if(e.target.id==='pvsort'){PV.sort=e.target.value;wp.innerHTML=wordsPanel(activeWords());}});
}

const getP=p=>p.split('.').reduce((o,k)=>o[k],S.settings);

const sub_=s=>s?`<span class="sub">${s}</span>`:'';
const num=(p,l,s='',min=0,max=1000,step=1)=>`<label class="sr"><span>${l}${sub_(s)}</span><input type="number" inputmode="decimal" data-p="${p}" min="${min}" max="${max}" step="${step}" value="${getP(p)}"></label>`;

    </tbody></table></div><div class="row"><button class="btn sm" id="stadd">${t('r_add')}</button></div>

  ${sect('forget',t('sec_forget'),

  ${sect('s-choice',exName('choice'),scoring('choice')+num('ex.choice.options',t('c_opts'),'',2,8))}

  ${sect('s-dictation',exName('dictation'),scoring('dictation')+

    chk('ex.dictation.showTr',t('dc_tr'))+

  ${sect('s-letters',exName('letters'),scoring('letters')+chk('ex.letters.letterOnError',t('l_lerr')))}

    chk('ex.cloze.letterOnError',t('w_lerr'),t('w_lerr_s'))+num('ex.cloze.costLetter',t('w_lcost'),t('w_lcost_s')))}
  ${sect('s-phrase',exName('phrase'),scoring('phrase')+chk('ex.phrase.wordOnError',t('ph_werr'))+num('ex.phrase.costWord',t('ph_cost')))}

    <label class="field" style="padding-top:10px">${t('dt_file')}<input type="file" id="rfile" accept=".json,application/json,text/plain"></label>
    <label class="field">${t('dt_paste')}<textarea class="big" id="rtext" placeholder='{"app":"wortkasten", …}'></textarea></label>
    <div class="row"><button class="btn" id="rdo">${t('dt_restore')}</button></div>
    <div class="row" style="padding-top:12px;border-top:1px solid var(--line);margin-top:10px"><button class="btn danger" id="resetall">${t('dt_reset')}</button><button class="btn danger" id="defset">${t('dt_def')}</button></div>
    <div id="bkbox"></div>`)}

  view.querySelectorAll('details.set').forEach(d=>d.addEventListener('toggle',()=>{if(d.open){S.ui.openSet=d.dataset.s;view.querySelectorAll('details.set').forEach(x=>{if(x!==d)x.open=false;});}else if(S.ui.openSet===d.dataset.s)S.ui.openSet=null;save();}));
  view.onchange=onSetChange;

  $('#rfile').onchange=async e=>{const f=e.target.files[0];if(f)$('#rtext').value=await f.text();};
  $('#rdo').onclick=e=>{let d;try{d=JSON.parse($('#rtext').value);}catch(err){toast(t('t_notbk'));return;}
    if(!d||d.app!=='wortkasten'||!Array.isArray(d.words)){toast(t('t_notwk'));return;}
    armed(e.target,()=>{S={v:1,dicts:d.dicts||[],words:d.words,settings:mergeDeep(defaults(),d.settings),log:d.log||{},lastActiveDay:d.lastActiveDay||null,decay:d.decay||null,miles:d.miles||{},best:d.best||0,ui:S.ui};
      if(!LANGS[S.settings.lang])S.settings.lang=L;L=S.settings.lang;R=null;save();renderChrome();toast(t('t_restored'));render();});};
  $('#resetall').onclick=e=>armed(e.target,()=>{S.words.forEach(w=>Object.assign(w,{st:'new',sc:0,stage:0,hits:0,due:0,dl:0,err:0,ok:0,last:0}));S.log={};S.miles={};S.best=0;S.lastActiveDay=null;S.decay=null;R=null;save();drawStreak();toast(t('t_preset'));renderSettings();});
  $('#defset').onclick=e=>armed(e.target,()=>{const lang=S.settings.lang;S.settings=defaults();S.settings.lang=lang;R=null;save();toast(t('t_sreset'));renderSettings();});

function onSetChange(e){
  const x=e.target;
  if(x.id==='voice'){S.settings.audio.voiceF=x.value;save();return;}
  if(x.dataset.st){const[i,k]=x.dataset.st.split('.');const v=Math.max(k==='times'?1:0,Math.round(+x.value||0));S.settings.repeat.stages[+i][k]=v;R=null;save();return;}
  const p=x.dataset.p;if(!p)return;let v;
  if(x.type==='checkbox')v=x.checked;else if(x.type==='number'){v=parseFloat(x.value);if(!isFinite(v))return;v=Math.min(+x.max||1e9,Math.max(+x.min||0,v));}else v=x.value;
  setP(p,v);
  if(p==='lang'){L=v;R=null;save();renderChrome();renderSettings();return;}
  R=null;save();
  if(p==='general.dailyGoal')drawStreak();
}
function fillVoices(){
  const s=$('#voice');if(!s)return;const l=(S.settings.audio.langF||'').slice(0,2).toLowerCase();
  const vs=VOICES.filter(v=>v.lang.toLowerCase().startsWith(l));
  s.innerHTML=`<option value="">${t('a_def')}</option>`+vs.map(v=>`<option value="${esc(v.name)}" ${S.settings.audio.voiceF===v.name?'selected':''}>${esc(v.name)}</option>`).join('');
}

/* ===================== help (manual) ===================== */
const HELP={
en:`<h2 class="h">How to use Wortkasten</h2>
<section><h3>Getting started</h3><ol>
<li>Open <b>Dictionaries</b> and load your own list: an Excel or CSV file, or text pasted from Quizlet. The example dictionary is there to try things out; delete it whenever you like.</li>
<li>Switch on the dictionaries you want to learn.</li>
<li>Go to <b>Learn</b>, pick an exercise at the top and answer. A round has 12 tasks. In Choice and Mosaic, words you get wrong come back at the end of the round; in the other exercises they open the next round.</li></ol></section>
<section><h3>How memorising works</h3>
<p>A correct answer adds points to the word, a mistake takes points off, and hints cost a few points. When a word reaches the threshold (120 by default), it counts as learned and moves to review: after 1, 4 and 8 days it comes back twice. Once it passes all reviews, the word is fully learned. If a review deadline is missed, the word goes back to learning.</p>
<p>A word earns at most 50 points a day, and only if at least an hour has passed since it last earned points. Practising three or four times a day, you learn a word in about three days; several rounds in a row do not rush it.</p>
<p>If you skip practice for more than two days, words in learning slowly lose points. This is the “ice slide”.</p>
<p>Only 25 words are in learning at once; new ones are added as others are learned. With <b>one dictionary at a time</b>, new words come only from the top active dictionary until it has none left, so switching between dictionaries does not scatter your attention. All numbers can be changed in Settings.</p></section>
<section><h3>Exercises</h3><ul>
<li><b>Choice</b>: pick the right answer out of four.</li>
<li><b>Mosaic</b>: match words with their translations.</li>
<li><b>Writing</b>: type the word. After a wrong letter the field turns red and the correct beginning of the word appears under it. A correct answer is accepted by itself.</li>
<li><b>Dictation</b>: listen and type the word (or a sentence from the examples, see Settings). <b>Listen</b> plays it again, <b>Slowly</b> plays it slower.</li>
<li><b>Letters</b>: tap the letters in the right order.</li>
<li><b>Gap</b>: type the word into a sentence. Separable verbs have two gaps (<i lang="de">Ich nehme … teil</i>).</li>
<li><b>Sentence</b>: tap the words in the right order.</li>
<li><b>der/die/das</b>: pick the article of a noun. Nouns must be written with their article (<i lang="de">das Haus</i>). This exercise only checks the gender and does not change the word's score.</li></ul>
<p><b>Letter</b> gives you the next letter. <b>Don't know</b> shows the answer and counts as a mistake. The ä ö ü ß keys are under the field. Letters typed in the wrong keyboard layout are fixed automatically and do not count as mistakes.</p>
<p><b>I know it</b>, above the task, takes a word out of learning straight away. To mark many words at once, open a dictionary → Words → Mark known words. Known words do not count towards “learned” and can be returned to learning in the word editor.</p></section>
<section><h3>Dictionaries</h3>
<p><b>+</b> next to the app name adds words quickly, one by one or as a list — for example after a lesson. Words added this way come first among new words for two weeks. During practice, <b>Edit the word</b> under the answer opens the word card; in Progress, tap a word to edit it.</p>
<p>For English and other languages, add the transcription in square brackets after the word (<i>cat [kæt]</i>) or in a separate column: it is shown next to the word and never has to be typed. Each dictionary can have its own language (Dictionaries → Language), which sets the voice and the keyboard layout.</p>
<p>Columns: word, translation, example, example translation; up to two more examples with translations can follow. With several examples, Gap and Sentence use a different one each time. Only the first two columns are required, and you can reassign the columns before loading. Ready-made dictionaries published with the app are listed under Load dictionary.</p>
<p>For a word to appear in <b>Gap</b>, its form in the example has to be in curly braces: <i lang="de">Ich {nehme} an einem Kongress {teil}.</i> Often the app finds the word by itself; the word editor shows whether it did.</p>
<p>Progress belongs to the word: if a word is in two dictionaries, learning it once counts for both.</p></section>
<section><h3>Progress</h3>
<p>The ring next to the app name shows how many days in a row you have practised; it fills up towards your daily goal. <b>Progress</b> shows the boxes (how many words are at each stage), your record, conquered hard words (10+ mistakes, then learned), milestones, and all words with their scores. You choose a prize for each milestone yourself in Settings → Goal and milestones.</p></section>
<section><h3>On iPhone, and backups</h3>
<p>Open the app's address in Safari and tap Share → Add to Home Screen. It then opens like a normal app and also works offline.</p>
<p>Your data lives only on this device. Make a backup now and then in Settings → Data and backup; you can restore it on any other device.</p></section>`,
de:`<h2 class="h">So funktioniert Wortkasten</h2>
<section><h3>Erste Schritte</h3><ol>
<li>Öffne <b>Wörterbücher</b> und lade deine eigene Liste: eine Excel- oder CSV-Datei oder Text aus Quizlet. Das Beispiel-Wörterbuch ist zum Ausprobieren da, du kannst es jederzeit löschen.</li>
<li>Schalte die Wörterbücher ein, die du lernen willst.</li>
<li>Geh zu <b>Lernen</b>, wähle oben eine Übung und antworte. Eine Runde hat 12 Aufgaben. Bei Auswahl und Mosaik kommen falsch beantwortete Wörter am Ende der Runde wieder, bei den anderen Übungen zu Beginn der nächsten Runde.</li></ol></section>
<section><h3>So funktioniert das Einprägen</h3>
<p>Eine richtige Antwort bringt dem Wort Punkte, ein Fehler kostet Punkte, und Hinweise kosten ein paar Punkte. Erreicht ein Wort die Schwelle (standardmäßig 120), gilt es als gelernt und kommt in die Wiederholung: nach 1, 4 und 8 Tagen erscheint es je zweimal. Hat es alle Wiederholungen geschafft, ist das Wort endgültig gelernt. Wird eine Frist verpasst, geht das Wort zurück ins Lernen.</p>
<p>Ein Wort bekommt höchstens 50 Punkte am Tag, und nur, wenn seit seinen letzten Punkten mindestens eine Stunde vergangen ist. Wer drei- bis viermal am Tag übt, lernt ein Wort so in etwa drei Tagen; mehrere Runden hintereinander beschleunigen das nicht.</p>
<p>Wenn du länger als zwei Tage pausierst, verlieren Wörter im Lernen langsam Punkte. Das ist die „Eisrutsche“.</p>
<p>Es sind immer nur 25 Wörter gleichzeitig im Lernen; neue kommen hinzu, sobald andere gelernt sind. Mit <b>ein Wörterbuch nach dem anderen</b> kommen neue Wörter nur aus dem obersten aktiven Wörterbuch, bis es keine mehr hat. So verzettelst du dich nicht zwischen mehreren Wörterbüchern. Alle Zahlen lassen sich in den Einstellungen ändern.</p></section>
<section><h3>Übungen</h3><ul>
<li><b>Auswahl</b>: wähle die richtige von vier Antworten.</li>
<li><b>Mosaik</b>: ordne Wörter ihren Übersetzungen zu.</li>
<li><b>Schreiben</b>: tippe das Wort. Nach einem falschen Buchstaben wird das Feld rot, und darunter erscheint der richtige Wortanfang. Eine richtige Antwort wird von selbst übernommen.</li>
<li><b>Diktat</b>: hör zu und schreib das Wort (oder einen Satz aus den Beispielen, siehe Einstellungen). <b>Anhören</b> spielt es noch einmal ab, <b>Langsam</b> langsamer.</li>
<li><b>Buchstaben</b>: tippe die Buchstaben in der richtigen Reihenfolge.</li>
<li><b>Lücke</b>: setz das Wort in einen Satz ein. Trennbare Verben haben zwei Lücken (<i lang="de">Ich nehme … teil</i>).</li>
<li><b>Satz</b>: tippe die Wörter in der richtigen Reihenfolge.</li>
<li><b>der/die/das</b>: wähle den Artikel eines Substantivs. Substantive müssen mit Artikel eingetragen sein (<i lang="de">das Haus</i>). Die Übung prüft nur das Genus und ändert die Punktzahl des Wortes nicht.</li></ul>
<p><b>Buchstabe</b> gibt dir den nächsten Buchstaben. <b>Weiß nicht</b> zeigt die Antwort und zählt als Fehler. Unter dem Feld findest du ä ö ü ß. Buchstaben im falschen Tastaturlayout werden automatisch korrigiert und zählen nicht als Fehler.</p>
<p><b>Kenne ich schon</b> über der Aufgabe nimmt ein Wort sofort aus dem Lernen. Viele Wörter auf einmal markierst du im Wörterbuch → Wörter → Bekannte markieren. Bekannte Wörter zählen nicht als „gelernt“ und lassen sich im Wort-Editor zurück ins Lernen schicken.</p></section>
<section><h3>Wörterbücher</h3>
<p><b>+</b> neben dem App-Namen fügt schnell Wörter hinzu, einzeln oder als Liste — etwa nach einer Lektion. So hinzugefügte Wörter kommen zwei Wochen lang als Erste unter den neuen Wörtern dran. Beim Üben öffnet <b>Wort bearbeiten</b> unter der Antwort die Wortkarte; unter „Fortschritt“ tippst du dafür auf ein Wort.</p>
<p>Für Englisch und andere Sprachen kannst du die Transkription in eckigen Klammern hinter das Wort schreiben (<i>cat [kæt]</i>) oder in eine eigene Spalte: Sie wird beim Wort gezeigt und muss nie getippt werden. Jedes Wörterbuch kann eine eigene Sprache haben (Wörterbücher → Sprache); danach richten sich Stimme und Tastaturlayout.</p>
<p>Spalten: Wort, Übersetzung, Beispiel, Übersetzung des Beispiels; danach können bis zu zwei weitere Beispiele mit Übersetzung folgen. Bei mehreren Beispielen nehmen „Lücke“ und „Satz“ jedes Mal ein anderes. Nur die ersten zwei Spalten sind Pflicht, und vor dem Laden kannst du die Spalten neu zuordnen. Fertige Wörterbücher, die mit der App veröffentlicht sind, findest du unter „Wörterbuch laden“.</p>
<p>Damit ein Wort in <b>Lücke</b> vorkommt, muss seine Form im Beispiel in geschweiften Klammern stehen: <i lang="de">Ich {nehme} an einem Kongress {teil}.</i> Oft findet die App das Wort selbst; im Wort-Editor siehst du, ob es geklappt hat.</p>
<p>Der Fortschritt gehört zum Wort: Steht ein Wort in zwei Wörterbüchern, zählt es nach einmaligem Lernen in beiden.</p></section>
<section><h3>Fortschritt</h3>
<p>Der Ring neben dem Namen zeigt, wie viele Tage in Folge du geübt hast; er füllt sich bis zu deinem Tagesziel. Unter <b>Fortschritt</b> siehst du die Kästen (wie viele Wörter in welcher Stufe sind), deinen Rekord, besiegte schwere Wörter (10+ Fehler, dann gelernt), Meilensteine und alle Wörter mit ihren Punkten. Eine Belohnung für jeden Meilenstein legst du selbst fest: Einstellungen → Ziel und Meilensteine.</p></section>
<section><h3>Auf dem iPhone und Sicherung</h3>
<p>Öffne die Adresse der App in Safari und tippe auf Teilen → Zum Home-Bildschirm. Dann startet sie wie eine normale App und funktioniert auch offline.</p>
<p>Deine Daten liegen nur auf diesem Gerät. Mach ab und zu eine Sicherung unter Einstellungen → Daten und Sicherung; damit kannst du alles auf einem anderen Gerät wiederherstellen.</p></section>`,
be:`<h2 class="h">Як карыстацца Wortkasten</h2>
<section><h3>З чаго пачаць</h3><ol>
<li>Адкрыйце <b>Слоўнікі</b> і загрузіце свой спіс: файл Excel або CSV ці тэкст з Quizlet. Слоўнік-прыклад — каб паспрабаваць; яго можна выдаліць у любы момант.</li>
<li>Уключыце слоўнікі, якія хочаце вучыць.</li>
<li>Перайдзіце ў <b>Вучыць</b>, выберыце ўверсе практыкаванне і адказвайце. У раўндзе 12 заданняў. У Варыянце і Мазаіцы словы з памылкамі вяртаюцца ў канцы раўнда, у астатніх практыкаваннях — у пачатку наступнага.</li></ol></section>
<section><h3>Як працуе запамінанне</h3>
<p>За правільны адказ слова атрымлівае балы, за памылку губляе, а падказкі каштуюць некалькі балаў. Калі слова дасягае парога (па змаўчанні 120), яно лічыцца вывучаным і пераходзіць у паўтор: праз 1, 4 і 8 дзён яно вяртаецца па два разы. Пасля ўсіх паўтораў слова вывучана канчаткова. Калі тэрмін паўтору прапушчаны, слова вяртаецца ў вывучэнне.</p>
<p>Слова атрымлівае не больш за 50 балаў за дзень, і толькі калі з апошніх балаў прайшла хаця б гадзіна. Калі займацца тры-чатыры разы на дзень, слова вывучаецца прыкладна за тры дні; некалькі раўндаў запар гэта не паскараюць.</p>
<p>Калі вы не займаецеся больш за два дні, словы ў вывучэнні паступова губляюць балы. Гэта «ледзяная горка».</p>
<p>Адначасова вывучаецца толькі 25 слоў; новыя дадаюцца, калі іншыя вывучаны. У рэжыме <b>па чарзе слоўнікаў</b> новыя словы бяруцца толькі з верхняга актыўнага слоўніка, пакуль у ім не скончацца, таму пераключэнне паміж слоўнікамі не распыляе ўвагу. Усе лічбы можна змяніць у наладах.</p></section>
<section><h3>Практыкаванні</h3><ul>
<li><b>Варыянт</b>: выберыце правільны адказ з чатырох.</li>
<li><b>Мазаіка</b>: злучыце словы з перакладамі.</li>
<li><b>Напісанне</b>: надрукуйце слова. Пасля няправільнай літары поле чырванее, а пад ім з’яўляецца правільны пачатак слова. Правільны адказ прымаецца сам.</li>
<li><b>Дыктоўка</b>: паслухайце і напішыце слова (або фразу з прыкладаў, гл. налады). <b>Слухаць</b> агучвае яшчэ раз, <b>Павольна</b> — павольней.</li>
<li><b>Літары</b>: націскайце літары ў правільным парадку.</li>
<li><b>Пропуск</b>: упішыце слова ў фразу. У дзеясловаў з аддзяляльнай прыстаўкай два пропускі (<i lang="de">Ich nehme … teil</i>).</li>
<li><b>Фраза</b>: націскайце словы ў правільным парадку.</li>
<li><b>der/die/das</b>: выберыце артыкль назоўніка. Назоўнікі павінны быць запісаны з артыклем (<i lang="de">das Haus</i>). Практыкаванне правярае толькі род і не мяняе бал слова.</li></ul>
<p><b>Літара</b> падказвае наступную літару. <b>Не ведаю</b> паказвае адказ і лічыцца памылкай. Пад полем ёсць ä ö ü ß. Літары, набраныя не ў той раскладцы, выпраўляюцца аўтаматычна і не лічацца памылкай.</p>
<p><b>Ужо ведаю</b> над заданнем адразу выводзіць слова з вывучэння. Каб адзначыць шмат слоў адразу, адкрыйце слоўнік → Словы → Адзначыць вядомыя. Вядомыя словы не лічацца «вывучанымі», і іх можна вярнуць у вывучэнне ў рэдактары слова.</p></section>
<section><h3>Слоўнікі</h3>
<p><b>+</b> побач з назвай праграмы хутка дадае словы, па адным або спісам — напрыклад, пасля ўрока. Такія словы два тыдні ідуць першымі сярод новых. Падчас практыкавання <b>Змяніць слова</b> пад адказам адкрывае картку слова; у «Прагрэсе» для гэтага дастаткова націснуць на слова.</p>
<p>Для англійскай і іншых моў транскрыпцыю можна дапісаць у квадратных дужках пасля слова (<i>cat [kæt]</i>) або ў асобны слупок: яна паказваецца побач са словам, і друкаваць яе не трэба. У кожнага слоўніка можа быць свая мова (Слоўнікі → Мова), ад яе залежаць голас і раскладка.</p>
<p>Слупкі: слова, пераклад, прыклад, пераклад прыкладу; далей могуць ісці яшчэ два прыклады з перакладамі. Калі прыкладаў некалькі, «Пропуск» і «Фраза» кожны раз бяруць іншы. Абавязковыя толькі першыя два слупкі, а перад загрузкай слупкі можна пераназначыць. Гатовыя слоўнікі, апублікаваныя разам з праграмай, ёсць у раздзеле «Загрузіць слоўнік».</p>
<p>Каб слова трапіла ў <b>Пропуск</b>, яго форма ў прыкладзе павінна быць у фігурных дужках: <i lang="de">Ich {nehme} an einem Kongress {teil}.</i> Часта праграма знаходзіць слова сама; у рэдактары слова відаць, ці атрымалася.</p>
<p>Прагрэс належыць слову: калі слова ёсць у двух слоўніках, яно залічваецца ў абодвух.</p></section>
<section><h3>Прагрэс</h3>
<p>Кольца побач з назвай паказвае, колькі дзён запар вы займаецеся, і запаўняецца да дзённай мэты. У раздзеле <b>Прагрэс</b> — скрыні (колькі слоў на кожнай стадыі), рэкорд, пераможаныя цяжкія словы (10+ памылак, потым вывучана), вехі і ўсе словы з баламі. Прыз за кожную веху вы прызначаеце самі: Налады → Мэта і вехі.</p></section>
<section><h3>На iPhone і рэзервовая копія</h3>
<p>Адкрыйце адрас праграмы ў Safari і націсніце «Абагуліць» → «На экран „Дадому“». Пасля гэтага яна адкрываецца як звычайная праграма і працуе без інтэрнэту.</p>
<p>Дадзеныя захоўваюцца толькі на гэтай прыладзе. Час ад часу рабіце рэзервовую копію ў Наладах → Дадзеныя і рэзервовая копія; з яе можна аднавіць усё на іншай прыладзе.</p></section>`
